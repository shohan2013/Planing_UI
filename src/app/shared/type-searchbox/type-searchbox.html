<div class="type-searchbox">

  <input
    #searchInput
    type="text"
    class="form-control"
    [formControl]="searchControl"
    [placeholder]="placeholder"
    [ngbTypeahead]="search"
    [resultFormatter]="itemFormatter"
    [inputFormatter]="itemFormatter"
    [focusFirst]="false"
    placement="bottom-start"
    container="body"
    autocomplete="off"
    (selectItem)="selectItem($event)"
    (keydown.arrowdown)="scrollActiveItem()"
    (keydown.arrowup)="scrollActiveItem()"
    (blur)="markTouched()">

  <div class="search-status">


    <span
      *ngIf="searchValidationMessage"
      class="text-muted">

      {{ searchValidationMessage }}
    </span>

    <span *ngIf="isSearching" class="text-primary">
      <span class="spinner-border spinner-border-sm me-1"></span>
      <!-- Searching... -->
       {{ searchingText }}
    </span>

    <span
      *ngIf="searchCompleted && !hasResults && !searchFailed"
      class="text-muted">

      <!-- No matching records found. -->
       {{ noResultsText }}
    </span>

    <span *ngIf="searchFailed" class="text-danger">
      <!-- Search failed. Please try again. -->
       {{ searchFailedText }}
    </span>

  </div>

</div>
