<div class="pvp-page">
  <app-pvp-filter-bar
    [filter]="filter()"
    [units]="units()"
    [businesses]="businesses()"
    [customers]="customers()"
    [deliveryOrders]="deliveryOrders()"
    [businessesLoading]="businessesLoading()"
    [customersLoading]="customersLoading()"
    [deliveryOrdersLoading]="deliveryOrdersLoading()"
    [items]="items()"
    [itemsLoading]="itemsLoading()"
    [loading]="loading()"
    (unitChange)="onUnitChange($event)"
    (customerSearch)="loadCustomers($event)"
    (deliveryOrderScopeChange)="loadDeliveryOrders($event)"
    (itemScopeChange)="loadItems($event)"
    (apply)="onApply($event)"
    (reset)="onReset()"
  />

  <app-pvp-kpi-cards [totals]="totals()" [loading]="totalsLoading()" />
  <app-pvp-overview-table
    [rows]="rows()"
    [loading]="loading()"
    [totalOrders]="totalOrders()"
    [pageQuery]="pageQuery()"
    [fetchAllRows]="fetchAllRows"
    [fetchOrderItems]="fetchOrderItems"
    (pageQueryChange)="onPageQueryChange($event)"
  />
</div>
