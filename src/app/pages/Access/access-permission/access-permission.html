<div class="user-card">

  <div class="card-header">
    <h5>PERMISSION</h5>
  </div>

  <div class="card-body">

    <div class="d-flex gap-3">
      <div class="flex-fill">
        <button type="button" class="btn-shadow d-inline-flex align-items-center btn btn-success" [disabled]="true"
          style="margin-left: 5px;">
          <i class="fa-solid fa-fw fa-plus" aria-hidden="true" title="plus"></i>
          Create New
        </button>
      </div>

      <div class="flex-fill">
        <ng-select
                  [items]="EmpList"
                  bindLabel="Name"
                  bindValue="Id"
                  [(ngModel)]="selectedUser"
                  placeholder="Search Employee..."
                  [searchable]="true"
                  [clearable]="true" style="margin-right: 5px;" (search)="onSearch($event)" (ngModelChange)="onSelect($event)">
          </ng-select>
      </div>
    </div><br />


    <div class="table-responsive">
      <table class="custom-table">
        <thead>
          <tr style="font-style: italic;">
          <th class="text-center">#</th>
          <th>MENU</th>
          <th>SUBMENU</th>
          <th>VIEW</th>
          <th>INSERT</th>
          <th >UPDATE</th>
          <th>DELETE</th>
          <th>PRINT</th>
          </tr>
        </thead>
        <tbody>
          @if(paginatedItems.length === 0){
          <tr>
            <td colspan="100%" class="text-center py-4">
                <i class="fas fa-folder-open fa-4x text-secondary mb-3"></i><br/>
              <h6 class="emptymsg">No Records Found.</h6>
            </td>
          </tr>
          }

          @for (item of paginatedItems; track trackById($index, item)) {
          <tr>
            <td>{{$index + 1 }}</td>
          <td>{{ item.Menu }}</td>
          <td>{{ item.SubMenu }}</td>
          <td>
                <div class="form-check form-switch d-flex justify-content-center align-items-center">
    <input class="form-check-input"
           type="checkbox"
           [(ngModel)]="item.CanView" (ngModelChange)="onToggle(item.Id,item.SubMenuId, 1,item.CanView)">
  </div>
          </td>
          <td> <div class="form-check form-switch d-flex justify-content-center align-items-center">
		<input class="form-check-input"
           type="checkbox"
           [(ngModel)]="item.CanInsert" (ngModelChange)="onToggle(item.Id,item.SubMenuId, 2,item.CanView)">
 
  </div></td>
          <td><div class="form-check form-switch d-flex justify-content-center align-items-center">
    <input class="form-check-input"
           type="checkbox"
           [(ngModel)]="item.CanUpdate" (ngModelChange)="onToggle(item.Id,item.SubMenuId, 3,item.CanView)">
  </div></td>
           <td><div class="form-check form-switch d-flex justify-content-center align-items-center">
    <input class="form-check-input"
           type="checkbox"
           [(ngModel)]="item.CanDelete" (ngModelChange)="onToggle(item.Id,item.SubMenuId, 4,item.CanView)">
    <!-- <label>
      {{ item.CanDelete ? 'ON' : 'OFF' }}
    </label> -->
  </div></td>
           <td><div class="form-check form-switch d-flex justify-content-center align-items-center">
    <input class="form-check-input"
           type="checkbox"
           [(ngModel)]="item.CanPrint" (ngModelChange)="onToggle(item.Id,item.SubMenuId, 5,item.CanView)">
    <!-- <label>
      {{ item.CanPrint ? 'ON' : 'OFF' }}
    </label> -->
  </div></td>
          </tr>
          }
        </tbody>
      </table>
    </div>
    <div class="card-footer">
     
    </div>

  </div>
</div>
