@if (line) {
<div class="ps-strip">
  @for (step of steps; track step) {
  <app-process-step-from
    [lineId]="line.Id"
    [stepName]="step"
    [machineOptions]="machineOptions"
    (save)="onStepSaved(step, $event)"
  >
  </app-process-step-from>
  }
</div>

<div class="ps-scroll-hint">
  <i class="fa-solid fa-arrows-left-right"></i>
  Scroll to see more steps
</div>
}
