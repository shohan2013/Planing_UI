<div class="card-body">
  <div class="col-md-12">
    <div class="card main-card mb-3">
      <div class="page-header">
        <h5>
          <i class="fa-regular fa-clipboard"></i>
          <b> DO PLANNING</b>
        </h5>
      </div>
      <div class="card-body">
        <!-- Basic Tabs using Bootstrap 5 -->
        <ul class="nav nav-tabs" id="basicTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="basic-tab1-tab"
              type="button"
              role="tab"
              aria-controls="basic-tab1"
              aria-selected="true"
              [class.active]="activeTab() === 'mergeOrSplit'"
              (click)="onTabChange('mergeOrSplit')"
            >
              MERGE/SPLIT DO
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="basic-tab2-tab"
              type="button"
              role="tab"
              aria-controls="basic-tab2"
              aria-selected="false"
              [class.active]="activeTab() === 'planning'"
              (click)="onTabChange('planning')"
            >
              PLANNING
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="basic-tab3-tab"
              type="button"
              role="tab"
              aria-controls="basic-tab3"
              aria-selected="false"
              [class.active]="activeTab() === 'planningHistory'"
              (click)="onTabChange('planningHistory')"
            >
              HISTORY
            </button>
          </li>
        </ul>
        <div class="tab-content" id="basicTabContent">
          <div
            class="tab-pane fade show active"
            id="basic-tab1"
            role="tabpanel"
            aria-labelledby="basic-tab1-tab"
          >
            @if (activeTab() === 'mergeOrSplit') {
            <app-delivery-orders> </app-delivery-orders>
            }
          </div>
          <div
            class="tab-pane fade show active"
            id="basic-tab1"
            role="tabpanel"
            aria-labelledby="basic-tab1-tab"
          >
            @if (activeTab() === 'planning') {
            <app-merged-planning> </app-merged-planning>
            }
          </div>
          <!-- <div
            class="tab-pane fade"
            id="basic-tab2"
            role="tabpanel"
            aria-labelledby="basic-tab2-tab"
          >
            @if (activeTab() === 'submenu') {
            <app-submenu></app-submenu>
            }
          </div>
          <div
            class="tab-pane fade"
            id="basic-tab3"
            role="tabpanel"
            aria-labelledby="basic-tab3-tab"
          >
            @if (activeTab() === 'permission') {
            <app-access-permission></app-access-permission>
            }
          </div>
          <div
            class="tab-pane fade"
            id="basic-tab4"
            role="tabpanel"
            aria-labelledby="basic-tab3-tab"
          >
            @if (activeTab() === 'approval') {
            <app-approvematrix></app-approvematrix>
            }
          </div> -->
        </div>
      </div>
    </div>
  </div>
</div>
