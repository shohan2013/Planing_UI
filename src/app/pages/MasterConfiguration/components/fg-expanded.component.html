<section class="fg-expanded">
  <div class="fg-tabs" role="tablist" aria-label="Finish good configuration">
    <button type="button" role="tab" [attr.aria-selected]="activeTab() === 'bom'" [class.active]="activeTab() === 'bom'" (click)="selectTab('bom')"><span>BOM</span></button>
    <button type="button" role="tab" [attr.aria-selected]="activeTab() === 'routing'" [class.active]="activeTab() === 'routing'" (click)="selectTab('routing')"><span>Routing</span></button>
    <button type="button" role="tab" [attr.aria-selected]="activeTab() === 'operation'" [class.active]="activeTab() === 'operation'" (click)="selectTab('operation')"><span>Operation</span></button>
    <button type="button" role="tab" [attr.aria-selected]="activeTab() === 'workcenter'" [class.active]="activeTab() === 'workcenter'" (click)="selectTab('workcenter')"><span>Workcenter</span></button>
    <button type="button" role="tab" [attr.aria-selected]="activeTab() === 'machine'" [class.active]="activeTab() === 'machine'" (click)="selectTab('machine')"><span>Machine</span></button>
  </div>


  @if (activeTab() === 'bom') {
  <app-bom [itemId]="itemId()" [itemName]="itemName()" [unitId]="unitId()" [businessId]="businessId()" />
}
</section>
