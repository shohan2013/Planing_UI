<div class="user-card">
  <div class="page-header">
    <h5>
      <i class="fa-solid fa-chart-bar"></i>
      <b> MACHINE UTILIZATION DASHBOARD</b>
    </h5>
  </div>
  <hr />
  <div class="card-body">
    <!-- Shared header: filters + tab nav, used by both tabs -->
    <div class="card mb-4 border-0 shadow-sm">
      <div class="card-body py-3">
        <div class="d-flex flex-wrap align-items-center gap-3">
          <div style="width: 220px">
            <div class="input-group">
              <div class="input-group-text">
                <i class="fa-solid fa-filter"></i>
              </div>

              <select
                class="form-select"
                [ngModel]="selectedUnitId"
                (ngModelChange)="onUnitChange($event)"
              >
                <option [ngValue]="0">All Units</option>
                @for (unit of units(); track unit.Id) {
                <option [ngValue]="unit.Id">{{ unit.Name }}</option>
                }
              </select>
            </div>
          </div>

          <div style="width: 220px">
            <div class="input-group">
              <div class="input-group-text">
                <i class="fa-solid fa-building"></i>
              </div>

              <select
                class="form-select"
                [ngModel]="selectedBusinessId"
                (ngModelChange)="onBusinessChange($event)"
                [disabled]="selectedUnitId === 0 || businessesLoading()"
              >
                <option [ngValue]="0">
                  {{ businessesLoading() ? 'Loading...' : 'All Businesses' }}
                </option>
                @for (business of businesses(); track business.Id) {
                <option [ngValue]="business.Id">{{ business.Name }}</option>
                }
              </select>
            </div>
          </div>

          <div style="width: 190px">
            <div class="input-group">
              <div class="input-group-text">
                <i class="fa-solid fa-calendar-day"></i>
              </div>

              <input
                type="date"
                class="form-control"
                placeholder="From Date"
                [ngModel]="fromDate"
                (ngModelChange)="fromDate = $event; onDateChange()"
                [max]="toDate"
              />
            </div>
          </div>

          <div style="width: 190px">
            <div class="input-group">
              <div class="input-group-text">
                <i class="fa-solid fa-calendar-check"></i>
              </div>

              <input
                type="date"
                class="form-control"
                placeholder="To Date"
                [ngModel]="toDate"
                (ngModelChange)="toDate = $event; onDateChange()"
                [min]="fromDate"
              />
            </div>
          </div>

          <button
            type="button"
            class="btn btn-success btn-shadow d-inline-flex align-items-center ms-auto"
            (click)="refresh()"
            [disabled]="loading()"
          >
            <i
              class="fa-solid fa-fw fa-arrows-rotate me-2"
              [class.fa-spin]="loading()"
            ></i>
            Refresh
          </button>
        </div>

        <hr class="my-3" />

        <!-- Tab nav -->
        <ul class="nav nav-tabs machine-dashboard-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              type="button"
              class="nav-link"
              [class.active]="activeTab() === 'overview'"
              role="tab"
              [attr.aria-selected]="activeTab() === 'overview'"
              (click)="setActiveTab('overview')"
            >
              <i class="fa-solid fa-fw fa-chart-pie me-1"></i>
              Overview
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              type="button"
              class="nav-link"
              [class.active]="activeTab() === 'timeline'"
              role="tab"
              [attr.aria-selected]="activeTab() === 'timeline'"
              (click)="setActiveTab('timeline')"
            >
              <i class="fa-solid fa-fw fa-timeline me-1"></i>
              Timeline
            </button>
          </li>
        </ul>
      </div>
    </div>

    <!-- Tab content -->
    @if (activeTab() === 'overview') {
    <app-machine-overview-tab
      [summary]="summary()"
      [machines]="machines()"
      [loading]="loading()"
    ></app-machine-overview-tab>
    } @else {
    <app-machine-timeline-tab
      [machines]="machines()"
      [loading]="loading()"
    ></app-machine-timeline-tab>
    }
  </div>
</div>
